<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GTA Pinas Roleplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --panel-bg: rgba(17, 19, 31, 0.70);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --discord-color: #5865F2;
            --discord-hover: #4752C4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { width: 100%; min-height: 100%; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)), url('/assets/fave.gif?v=20260806-university') no-repeat center center/cover;
            color: var(--text-primary); overflow: hidden;
        }
        .page { position: relative; min-height: 100vh; width: 100%; display: flex; justify-content: center; align-items: center; padding: 24px; }
        .login-card, .login-panel {
            position: relative; z-index: 2; background: var(--panel-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border); border-radius: 16px; padding: 40px 32px; width: 90%; max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); text-align: center; animation: fadeIn .8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .header, .brand { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
        .logo { width: 64px; height: 64px; background: transparent; border-radius: 0; display: flex; align-items: center; justify-content: center; border: none; box-shadow: none; flex: 0 0 64px; overflow: visible; }
        .logo img { width: 64px; height: 64px; max-width: 64px; object-fit: contain; display: block; mix-blend-mode: screen; background: transparent; filter: drop-shadow(0 8px 15px rgba(22,119,255,.24)); }
        .header-text { text-align: left; }
        .subtitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); margin-bottom: 4px; }
        .title, .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.5px; line-height: 1.2; }
        .description { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 32px; padding: 0 10px; }
        .notice { display: none; margin-bottom: 16px; padding: 13px 14px; border: 1px solid rgba(255,105,135,.42); border-radius: 8px; color: #fff; background: rgba(119,25,45,.78); font-size: 13px; line-height: 1.5; }
        .notice.show { display: block; }
        .discord-btn, .discord-login { display: flex; align-items: center; justify-content: center; gap: 12px; background-color: var(--discord-color); color: white; text-decoration: none; padding: 14px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; transition: all .3s ease; width: 100%; margin-bottom: 28px; border: none; cursor: pointer; }
        .discord-btn i { font-size: 20px; }
        .discord-btn:hover, .discord-login:hover { background-color: var(--discord-hover); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(88,101,242,.4); }
        .footer, .access-note { border-top: 1px solid var(--panel-border); padding-top: 24px; }
        .footer p, .access-note { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .footer p:last-child, .maintained { margin-bottom: 0; font-size: 11px; opacity: .7; }
        .maintained { margin-top: 6px; }

        /* Simple music control: play/pause only. */
        .ost-player, .music-player {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 5;
        }
        .ost-toggle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--discord-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.12);
            cursor: pointer;
            transition: all .3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }
        .ost-toggle:hover {
            background: var(--discord-hover);
            transform: scale(1.06);
            box-shadow: 0 8px 20px rgba(88,101,242,.4);
        }
        .ost-toggle i { font-size: 16px; }
        @media (max-width: 600px) {
            body { overflow: auto; }
            .music-player, .ost-player { bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="login-card login-panel">
            <div class="header brand">
                <div class="logo"><img src="/assets/gta-pinas-logo.svg" alt="GTA Pinas Revamped"></div>
                <div class="header-text">
                    <div class="subtitle">Ticket Support</div>
                    <div class="title" id="loginTitle">GTA Pinas Roleplay</div>
                </div>
            </div>
            <p class="description">Sign in using your registered Discord admin account to access the panel.</p>
            <div id="noticeBox" class="notice" role="alert"></div>
            <a id="discordLoginButton" href="/auth/discord" class="discord-btn discord-login"><i class="fa-brands fa-discord"></i><span>Continue with Discord</span></a>
            <div class="footer">
                <p>GTA Pinas Roleplay Management Panel</p>
                <p>Managed by Zoey</p>
            </div>
        </div>
    </main>

    <aside id="ostPlayer" class="music-player ost-player" aria-label="GTA Pinas soundtrack control">
        <audio id="loginOst" src="/assets/gtapinasmusic2.mp3?v=20260911-music5" preload="auto" autoplay loop></audio>
        <button id="ostToggle" class="ost-toggle" type="button" aria-label="Pause soundtrack" aria-pressed="true">
            <i class="fa-solid fa-pause"></i>
        </button>
    </aside>

    <script>
        const noticeBox = document.getElementById('noticeBox');
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const customMessage = params.get('message');
        const expired = params.get('expired');
        const messages = {
            access_denied:'Discord authorization was cancelled.', cancelled:'Discord authorization was cancelled.', denied:'YOU ARE NOT A REGISTERED ADMIN.',
            not_authorized:'YOU ARE NOT A REGISTERED ADMIN.', not_member:'YOU ARE NOT A REGISTERED ADMIN.', auth_required:'Please sign in using your registered Discord admin account.',
            session_expired:'Your session expired. Please sign in again.', token_exchange_failed:'Discord login could not be completed. Please try again.',
            oauth_expired:'That Discord login link was already used or expired. Please start a new login.', invalid_state:'The login session expired. Please start the Discord login again.',
            oauth_configuration:'Discord OAuth is not configured correctly on the Web Panel.', discord_error:'Discord could not complete the login request. Please try again.',
            server:'A server error occurred during login. Please try again.', login_failed:'A server error occurred during login. Please try again.'
        };
        const noticeText = customMessage || messages[error] || (expired === '1' ? 'Your session expired. Please sign in again.' : '');
        if (noticeText) { noticeBox.textContent = noticeText; noticeBox.classList.add('show'); }

        const loginButton = document.getElementById('discordLoginButton');
        loginButton?.addEventListener('click', () => {
            loginButton.style.pointerEvents='none';
            loginButton.style.opacity='.72';
            const label=loginButton.querySelector('span');
            if(label) label.textContent='Connecting to Discord...';
        }, {once:true});

        const ostAudio = document.getElementById('loginOst');
        const ostToggle = document.getElementById('ostToggle');
        const playIcon = '<i class="fa-solid fa-play"></i>';
        const pauseIcon = '<i class="fa-solid fa-pause"></i>';

        function updateOstState() {
            const playing = !ostAudio.paused && !ostAudio.ended;
            ostToggle.innerHTML = playing ? pauseIcon : playIcon;
            ostToggle.setAttribute('aria-label', playing ? 'Pause soundtrack' : 'Play soundtrack');
            ostToggle.setAttribute('aria-pressed', String(playing));
        }

        async function playOst() {
            try {
                await ostAudio.play();
                updateOstState();
            } catch (_) {
                updateOstState();
            }
        }

        ostToggle.addEventListener('click', () => {
            if (ostAudio.paused) playOst();
            else { ostAudio.pause(); updateOstState(); }
        });

        ostAudio.addEventListener('play', updateOstState);
        ostAudio.addEventListener('pause', updateOstState);
        ostAudio.addEventListener('ended', updateOstState);
        ostAudio.addEventListener('error', updateOstState);
        document.addEventListener('DOMContentLoaded', playOst);
        playOst();
    </script>
</body>
</html>
