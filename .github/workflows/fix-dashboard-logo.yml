name: Fix dashboard logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-logo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix dashboard logo rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          old = '''        .sidebar-header .logo {\n            width: 40px;\n            height: 40px;\n            box-shadow: 0 0 0 4px var(--primary-glow), 0 10px 25px rgba(0,0,0,.3);\n        }'''
          new = '''        .sidebar-header .logo {\n            width: 40px;\n            height: 40px;\n            box-shadow: 0 0 0 4px var(--primary-glow), 0 10px 25px rgba(0,0,0,.3);\n            object-fit: contain;\n            object-position: center;\n        }'''
          if old not in text:
              raise SystemExit('Expected sidebar logo CSS block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard logo rendering [dashboard-logo-fix]"
          git push
